<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="plexiGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="standBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#e0e0e0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5" />
    </linearGradient>
    <filter id="standShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="445" rx="150" ry="18" fill="#000000" opacity="0.4" />

  <!-- Plexiglass Stand Frame -->
  <g filter="url(#standShadow)">
    <!-- Base Plate -->
    <rect x="70" y="415" width="260" height="20" rx="4" fill="url(#standBase)" stroke="rgba(255,255,255,0.7)" stroke-width="2" />
    <line x1="80" y1="425" x2="320" y2="425" stroke="#ffffff" stroke-width="2" opacity="0.8" />

    <!-- Vertical Transparent Acrylic Sheet -->
    <rect x="90" y="50" width="220" height="370" rx="10" fill="#281344" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" />
    
    <!-- Printed Card Insert Inside Plexiglass -->
    <rect x="100" y="60" width="200" height="350" rx="8" fill="#1d0d33" />
    
    <!-- speedPrint Logo on Insert -->
    <text x="200" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-style="italic" font-size="19" fill="#ffffff">
      speed<tspan fill="#F6B544">print</tspan>
    </text>
    <text x="200" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8.5" fill="#F6B544" letter-spacing="4">DIGITAL</text>

    <!-- Headline on stand -->
    <text x="200" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#ffffff">Scannez notre menu</text>
    
    <!-- QR Code Graphic Container -->
    <rect x="135" y="175" width="130" height="130" rx="10" fill="#ffffff" />
    
    <!-- QR Code Matrix Simulation -->
    <g fill="#281344">
      <!-- Top Left Eye -->
      <rect x="145" y="185" width="30" height="30" rx="3" />
      <rect x="151" y="191" width="18" height="18" rx="2" fill="#ffffff" />
      <rect x="155" y="195" width="10" height="10" rx="1" />

      <!-- Top Right Eye -->
      <rect x="225" y="185" width="30" height="30" rx="3" />
      <rect x="231" y="191" width="18" height="18" rx="2" fill="#ffffff" />
      <rect x="235" y="195" width="10" height="10" rx="1" />

      <!-- Bottom Left Eye -->
      <rect x="145" y="265" width="30" height="30" rx="3" />
      <rect x="151" y="271" width="18" height="18" rx="2" fill="#ffffff" />
      <rect x="155" y="275" width="10" height="10" rx="1" />

      <!-- Data Bits -->
      <rect x="185" y="185" width="8" height="8" />
      <rect x="205" y="185" width="8" height="8" />
      <rect x="195" y="195" width="8" height="8" />
      <rect x="185" y="210" width="12" height="12" />
      <rect x="205" y="210" width="8" height="8" />
      <rect x="225" y="225" width="12" height="8" />
      <rect x="185" y="235" width="8" height="12" />
      <rect x="200" y="240" width="14" height="8" />
      <rect x="230" y="245" width="8" height="8" />
      <rect x="185" y="265" width="12" height="8" />
      <rect x="205" y="270" width="8" height="12" />
      <rect x="225" y="270" width="15" height="8" />
      <rect x="245" y="260" width="8" height="12" />
      <rect x="195" y="285" width="18" height="8" />
      <rect x="225" y="285" width="8" height="8" />
    </g>

    <!-- Center QR Logo Badge -->
    <rect x="188" y="228" width="24" height="24" rx="4" fill="#F6B544" />
    <text x="200" y="244" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#281344">SP</text>

    <!-- Scan Instruction & Phone Icon -->
    <g transform="translate(150, 325)">
      <rect x="0" y="0" width="14" height="22" rx="3" fill="none" stroke="#F6B544" stroke-width="2" />
      <circle cx="7" cy="17" r="1.5" fill="#F6B544" />
      <text x="24" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#ffffff">Scannez &amp; Commandez</text>
    </g>

    <text x="200" y="375" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#c0b3d6">Accès direct sans application</text>
    <text x="200" y="393" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#F6B544">Bonne dégustation !</text>

    <!-- Diagonal Glass Reflection Highlight -->
    <polygon points="95,55 170,55 130,415 95,415" fill="url(#plexiGlass)" />
    <line x1="90" y1="50" x2="310" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.9" />
  </g>
</svg>
