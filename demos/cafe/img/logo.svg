<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="cafeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3d271d" />
      <stop offset="100%" stop-color="#1b100a" />
    </radialGradient>
    <linearGradient id="warmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#d4a373" />
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#cafeBg)" stroke="url(#warmGold)" stroke-width="5" />
  <circle cx="200" cy="200" r="178" fill="none" stroke="#d4a373" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
  
  <!-- Coffee Cup & Steam -->
  <g transform="translate(200, 160)" stroke="url(#warmGold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Steam -->
    <path d="M -20 -40 Q -10 -60 -20 -80" stroke-width="4" opacity="0.7" />
    <path d="M 0 -45 Q 10 -65 0 -85" stroke-width="4.5" />
    <path d="M 20 -40 Q 30 -60 20 -80" stroke-width="4" opacity="0.7" />
    <!-- Cup Body -->
    <path d="M -50 -10 L 50 -10 C 45 40 -45 40 -50 -10 Z" fill="#2d1c14" stroke-width="5" />
    <!-- Handle -->
    <path d="M 45 0 C 65 0 65 25 40 25" stroke-width="4.5" />
    <!-- Saucer -->
    <path d="M -65 44 L 65 44" stroke-width="5" />
  </g>

  <!-- Typography -->
  <text x="200" y="275" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="3">L'ATELIER</text>
  <text x="200" y="300" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#d4a373" letter-spacing="5">CAFÉ &amp; BRUNCH</text>
  <text x="200" y="325" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#a89a8c" letter-spacing="2">RABAT · AGDAL</text>
</svg>
