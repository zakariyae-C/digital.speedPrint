<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="restBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#142c22" />
      <stop offset="100%" stop-color="#0a1410" />
    </radialGradient>
    <linearGradient id="restGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae19c" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997a15" />
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#restBg)" stroke="url(#restGold)" stroke-width="5" />
  <circle cx="200" cy="200" r="178" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
  
  <!-- Cloche / Plate Crest -->
  <g transform="translate(200, 160)" stroke="url(#restGold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handle -->
    <path d="M -10 -55 C -10 -65 10 -65 10 -55" stroke-width="4" />
    <!-- Cloche dome -->
    <path d="M -60 -10 C -60 -55 60 -55 60 -10 Z" fill="#18362a" stroke-width="4.5" />
    <!-- Base platter -->
    <path d="M -75 -6 L 75 -6" stroke-width="5" />
    <!-- Fork & Knife stars -->
    <circle cx="0" cy="25" r="3" fill="#d4af37" />
    <path d="M -25 25 L 25 25" stroke-width="2" />
  </g>

  <!-- Typography -->
  <text x="200" y="275" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="700" font-size="26" fill="#ffffff" letter-spacing="4">L'ÉTOILE</text>
  <text x="200" y="300" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#d4af37" letter-spacing="6">BISTRONOMIE &amp; GRILL</text>
  <text x="200" y="325" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#88a898" letter-spacing="3">RABAT · HAUT DE GAMME</text>
</svg>
